[project]
name = "atd-python-vgl-export"
version = "0.1.0"
description = "Notebook で ALIKED を可搬 ONNX へ export する専用環境。"
requires-python = ">=3.12,<3.13"
dependencies = [
  # https://pytorch.org/get-started/previous-versions/ の CUDA 13.0 対応ペア。
  "torch==2.11.0",
  "torchvision==0.26.0",
  "onnx==1.23.2",
  "numpy==2.5.5",
  "Pillow==13.0.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
