# ATD Gazebo の RigImu は白色雑音やバイアスを加えず、姿勢の数値微分で観測を生成する。
# ORB の事前積分に使う正の重みには、公式 Stereo-Inertial EuRoC 例の4値を採用する。
# 撮影・IMU の周期と外部姿勢は各 bag から取得する。
# https://github.com/UZ-SLAMLab/ORB_SLAM3/blob/4452a3c4ab75b1cde34e5505a36ec3f9edcdc4c4/Examples/Stereo-Inertial/EuRoC.yaml#L74-L77
gyro_noise_density: 1.7e-04   # rad/s/√Hz
accel_noise_density: 2.0e-03  # m/s²/√Hz
gyro_random_walk: 1.9393e-05  # rad/s²/√Hz
accel_random_walk: 3.0e-03    # m/s³/√Hz
