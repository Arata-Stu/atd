[project]
name = "atd-processing"
version = "0.1.0"
description = "ATD のオフライン地図幾何処理"
requires-python = ">=3.12"
dependencies = ["shapely>=2.1,<3", "numpy>=2.4.6,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atd_processing"]
