[project]
name = "atd-web"
version = "0.1.0"
description = "ATD Notebook 共通 Web API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "atd-processing"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.uv.sources]
atd-processing = {path = "../processing", editable = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atd_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
